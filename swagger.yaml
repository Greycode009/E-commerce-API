openapi: 3.0.0
info:
  title: E-Commerce API
  version: 1.0.0
  description: API documentation for the E-Commerce API

servers:
  - url: http://localhost:3000

tags:
  - name: Health
    description: API health check
  - name: Auth
    description: User authentication and authorization
  - name: Products
    description: Product management and discovery
  - name: Cart
    description: Shopping cart operations
  - name: Orders
    description: Order management
  - name: Payments
    description: Payment operations
  - name: Reviews
    description: Product reviews and ratings
  - name: Admin
    description: Admin management

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check API health
      responses:
        "200":
          description: API is running successfully

  /api/users/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Register a consumer or merchant account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: Password@123
                role:
                  type: string
                  enum:
                    - consumer
                    - merchant
                  example: consumer
      responses:
        "201":
          description: User registered successfully
        "400":
          description: Validation failed

  /api/users/verify-otp:
    post:
      tags:
        - Auth
      summary: Verify OTP
      description: Verify a user's account using the OTP sent during registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                otp:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: OTP verified successfully
        "400":
          description: Invalid or expired OTP

  /api/users/resend-otp:
    post:
      tags:
        - Auth
      summary: Resend OTP
      description: Send a new OTP to the user's email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
      responses:
        "200":
          description: OTP resent successfully
        "400":
          description: Validation failed

  /api/users/login:
    post:
      tags:
        - Auth
      summary: Login
      description: Authenticate a user and return access/refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  example: Password@123
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid email or password
        "403":
          description: Account not verified or deactivated

  /api/users/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Generate a new access token using the refresh token.
      responses:
        "200":
          description: Access token refreshed successfully
        "401":
          description: Invalid or expired refresh token

  /api/users/logout:
    post:
      tags:
        - Auth
      summary: Logout
      description: Logout the current user and invalidate the refresh token.
      responses:
        "200":
          description: Logged out successfully

  /api/users/logout-all:
    post:
      tags:
        - Auth
      summary: Logout from all devices
      description: Invalidate all active sessions for the authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out from all devices successfully
        "401":
          description: Authentication required

  /api/products:
    get:
      tags:
        - Products
      summary: Get all products
      description: Get products with search, filtering, sorting, and pagination.
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search products by title

        - in: query
          name: category
          schema:
            type: string
          description: Filter products by category

        - in: query
          name: minPrice
          schema:
            type: number
            minimum: 0
          description: Minimum product price

        - in: query
          name: maxPrice
          schema:
            type: number
            minimum: 0
          description: Maximum product price

        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number

        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 10
          description: Number of products per page

        - in: query
          name: sort
          schema:
            type: string
            enum:
              - price_asc
              - price_desc
              - newest
              - oldest
          description: Sort products

      responses:
        "200":
          description: Products fetched successfully

    post:
      tags:
        - Products
      summary: Create a new product
      description: Create a product as an authenticated merchant.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - price
                - stock
                - category
              properties:
                title:
                  type: string
                  example: iPhone 15
                description:
                  type: string
                  example: Latest Apple smartphone
                price:
                  type: number
                  example: 999
                stock:
                  type: integer
                  example: 10
                category:
                  type: string
                  example: electronics
                imageUrl:
                  type: string
                  format: uri
                  example: https://example.com/iphone.jpg
      responses:
        "201":
          description: Product created successfully
        "401":
          description: Authentication required
        "403":
          description: Access denied

  /api/products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        "200":
          description: Product fetched successfully
        "404":
          description: Product not found

    patch:
      tags:
        - Products
      summary: Update product
      description: Update a product as the merchant who owns it.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                price:
                  type: number
                stock:
                  type: integer
                category:
                  type: string
                imageUrl:
                  type: string
                  format: uri
      responses:
        "200":
          description: Product updated successfully
        "401":
          description: Authentication required
        "403":
          description: Access denied
        "404":
          description: Product not found

    delete:
      tags:
        - Products
      summary: Delete product
      description: Delete a product as the merchant who owns it.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        "200":
          description: Product deleted successfully
        "401":
          description: Authentication required
        "403":
          description: Access denied
        "404":
          description: Product not found

  /api/cart:
    get:
      tags:
        - Cart
      summary: Get my cart
      description: Get the authenticated consumer's cart.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart fetched successfully
        "401":
          description: Authentication required

    delete:
      tags:
        - Cart
      summary: Clear cart
      description: Remove all items from the authenticated consumer's cart.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart cleared successfully
        "401":
          description: Authentication required

  /api/cart/items:
    post:
      tags:
        - Cart
      summary: Add product to cart
      description: Add a product to the authenticated consumer's cart.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - quantity
              properties:
                productId:
                  type: string
                  example: 65f123456789abcdef123456
                quantity:
                  type: integer
                  minimum: 1
                  example: 2
      responses:
        "201":
          description: Product added to cart successfully
        "400":
          description: Invalid quantity or insufficient stock
        "401":
          description: Authentication required
        "404":
          description: Product not found

  /api/cart/items/{productId}:
    patch:
      tags:
        - Cart
      summary: Update cart item quantity
      description: Update the quantity of a product in the authenticated consumer's cart.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  example: 3
      responses:
        "200":
          description: Cart item updated successfully
        "400":
          description: Invalid quantity or insufficient stock
        "401":
          description: Authentication required
        "404":
          description: Cart item not found

    delete:
      tags:
        - Cart
      summary: Remove item from cart
      description: Remove a specific product from the authenticated consumer's cart.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        "200":
          description: Cart item removed successfully
        "401":
          description: Authentication required
        "404":
          description: Cart item not found

  /api/orders:
    post:
      tags:
        - Orders
      summary: Create a new order
      description: Create an order from the authenticated consumer's cart.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Order created successfully
        "400":
          description: Cart is empty or insufficient stock
        "401":
          description: Authentication required

  /api/orders/my-orders:
    get:
      tags:
        - Orders
      summary: Get my orders
      description: Get orders belonging to the authenticated consumer.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orders fetched successfully
        "401":
          description: Authentication required

  /api/orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: Order ID
      responses:
        "200":
          description: Order fetched successfully
        "401":
          description: Authentication required
        "404":
          description: Order not found

  /api/orders/{orderId}/cancel:
    patch:
      tags:
        - Orders
      summary: Cancel order
      description: Cancel a pending order belonging to the authenticated consumer.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: Order ID
      responses:
        "200":
          description: Order cancelled successfully
        "400":
          description: Only pending orders can be cancelled
        "401":
          description: Authentication required
        "404":
          description: Order not found
  /api/orders/merchant:
    get:
      tags:
        - Orders
      summary: Get merchant orders
      description: Get orders containing products owned by the authenticated merchant.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Merchant orders fetched successfully
        "401":
          description: Authentication required
        "403":
          description: Access denied

  /api/orders/{orderId}/status:
    patch:
      tags:
        - Orders
      summary: Update order status
      description: Update the status of an order containing the merchant's products.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - pending
                    - confirmed
                    - cancelled
                  example: confirmed
      responses:
        "200":
          description: Order status updated successfully
        "400":
          description: Invalid order status
        "401":
          description: Authentication required
        "403":
          description: Access denied
        "404":
          description: Order not found

  /api/payments:
    post:
      tags:
        - Payments
      summary: Create a payment
      description: Create a payment for an order belonging to the authenticated consumer.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
                - method
              properties:
                orderId:
                  type: string
                  example: 65f123456789abcdef123456
                method:
                  type: string
                  enum:
                    - cod
                    - online
                  example: cod
      responses:
        "201":
          description: Payment created successfully
        "400":
          description: Payment already exists or order cannot be paid
        "401":
          description: Authentication required
        "403":
          description: Access denied
        "404":
          description: Order not found

  /api/payments/{paymentId}/status:
    patch:
      tags:
        - Payments
      summary: Update payment status
      description: Update a payment to paid or failed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: paymentId
          required: true
          schema:
            type: string
          description: Payment ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - paid
                    - failed
                  example: paid
      responses:
        "200":
          description: Payment status updated successfully
        "400":
          description: Invalid payment status or payment already completed
        "401":
          description: Authentication required
        "403":
          description: Access denied
        "404":
          description: Payment not found

  /api/reviews:
    post:
      tags:
        - Reviews
      summary: Create a product review
      description: Create a review for a product the authenticated consumer has purchased.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - rating
                - comment
              properties:
                productId:
                  type: string
                  example: 65f123456789abcdef123456
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 5
                comment:
                  type: string
                  example: Great product!
      responses:
        "201":
          description: Review created successfully
        "400":
          description: Invalid review data or duplicate review
        "401":
          description: Authentication required
        "403":
          description: Product was not purchased

  /api/reviews/{reviewId}:
    patch:
      tags:
        - Reviews
      summary: Update my review
      description: Update a review owned by the authenticated consumer.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
          description: Review ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 4
                comment:
                  type: string
                  example: Good product.
      responses:
        "200":
          description: Review updated successfully
        "400":
          description: Invalid review data
        "401":
          description: Authentication required
        "404":
          description: Review not found

    delete:
      tags:
        - Reviews
      summary: Delete my review
      description: Delete a review owned by the authenticated consumer.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
          description: Review ID
      responses:
        "200":
          description: Review deleted successfully
        "401":
          description: Authentication required
        "404":
          description: Review not found

  /api/reviews/product/{productId}:
    get:
      tags:
        - Reviews
      summary: Get product reviews
      description: Get all reviews for a product, sorted by newest first.
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        "200":
          description: Product reviews fetched successfully
        "404":
          description: Product not found

  /api/reviews/product/{productId}/rating:
    get:
      tags:
        - Reviews
      summary: Get product rating
      description: Get the average rating and total number of reviews for a product.
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
          description: Product ID
      responses:
        "200":
          description: Product rating fetched successfully
        "404":
          description: Product not found

  /api/admin/users:
    get:
      tags:
        - Admin
      summary: Get all users
      description: Get all users. Admin access required.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users fetched successfully
        "401":
          description: Authentication required
        "403":
          description: Admin access required

  /api/admin/users/{userId}:
    get:
      tags:
        - Admin
      summary: Get user by ID
      description: Get an individual user. Admin access required.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: User ID
      responses:
        "200":
          description: User fetched successfully
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: User not found

    delete:
      tags:
        - Admin
      summary: Delete user
      description: Permanently delete a user. Admin access required.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: User ID
      responses:
        "200":
          description: User deleted successfully
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: User not found

  /api/admin/users/{userId}/status:
    patch:
      tags:
        - Admin
      summary: Activate or deactivate user
      description: Change the active status of a user. Admin access required.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isActive
              properties:
                isActive:
                  type: boolean
                  example: false
      responses:
        "200":
          description: User status updated successfully
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: User not found

  /api/admin/merchants:
    get:
      tags:
        - Admin
      summary: Get all merchants
      description: Get all merchants. Admin access required.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Merchants fetched successfully
        "401":
          description: Authentication required
        "403":
          description: Admin access required

  /api/admin/merchants/{merchantId}:
    get:
      tags:
        - Admin
      summary: Get merchant by ID
      description: Get an individual merchant. Admin access required.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: merchantId
          required: true
          schema:
            type: string
          description: Merchant ID
      responses:
        "200":
          description: Merchant fetched successfully
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: Merchant not found

  /api/admin/orders:
    get:
      tags:
        - Admin
      summary: Get all orders
      description: Get all orders. Admin access required.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orders fetched successfully
        "401":
          description: Authentication required
        "403":
          description: Admin access required

  /api/admin/orders/{orderId}:
    get:
      tags:
        - Admin
      summary: Get order by ID
      description: Get an individual order. Admin access required.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: Order ID
      responses:
        "200":
          description: Order fetched successfully
        "401":
          description: Authentication required
        "403":
          description: Admin access required
        "404":
          description: Order not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
